# From https://marcus.se.net/obsidian-plugin-docs/publishing/release-your-plugin-with-github-actions

name: Release Obsidian plugin
permissions:
  contents: write

on:
  push:
    tags:
      - "*"

env:
  PLUGIN_NAME: obsidian-typewriter-mode

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Build
        run: |
          bun install
          mise run ci
          mkdir ${{ env.PLUGIN_NAME }}
          cp -r dist/* ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}.zip ${{ env.PLUGIN_NAME }}

      - name: Create Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          prerelease: ${{ contains(github.ref, '-') }}
          body_path: ./dist/release-notes.md
          files: |
            ${{ env.PLUGIN_NAME }}.zip
            dist/main.js
            dist/manifest.json
            dist/styles.css
