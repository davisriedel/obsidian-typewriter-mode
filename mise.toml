[tools]
rust = "1.98.1"
"cargo:grass" = "0.13.4"
rumdl = "0.2.62"

[tasks.default]
description = "List available tasks"
run = "mise tasks"

[tasks.lint]
description = "Lint and format source files"
run = "bun biome check --write"

[tasks.lint-styles]
description = "Lint and format styles"
run = 'bun stylelint --fix "src/**/*.scss"'

[tasks.lint-md]
description = "Lint and format Markdown"
run = "rumdl check --fix ."

[tasks.typecheck]
description = "Type-check the project"
run = "bun tsc --noEmit"

[tasks.check]
description = "Run all checks"
depends = ["typecheck", "lint", "lint-styles", "lint-md"]

[tasks.build]
description = "Build the plugin"
run = "bun ./scripts/build.ts"

[tasks.build-lib]
description = "Build the plugin library"
run = "bun ./scripts/build.ts --lib"

[tasks.create-test-vault]
description = "Create an empty Obsidian test vault"
run = "mkdir -p test-vault/.obsidian"

[tasks.open-test-vault]
description = "Open the test vault in Obsidian"
depends = ["create-test-vault"]
run = '''
obsidian eval "code=window.electron.ipcRenderer.sendSync('vault-open', '$(pwd)/test-vault', false)"
'''

[tasks.dev]
description = "Build the plugin in development mode"
depends = ["create-test-vault"]
run = "bun ./scripts/dev.ts"

[tasks.debug]
description = "Build the plugin with debug logging"
depends = ["create-test-vault"]
run = "bun ./scripts/dev.ts --debug"

[tasks.release]
description = "Check and release the plugin"
depends = ["check"]
run = "bun ./scripts/release.ts"

[tasks.ci]
description = "Generate CI artifacts"
depends = ["build"]
run = "bun ./scripts/generate-ci-artefacts.ts"
